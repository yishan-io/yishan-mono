name: PR Unit Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect affected test targets
    runs-on: ubuntu-latest
    outputs:
      bun_matrix: ${{ steps.build-matrix.outputs.bun_matrix }}
      run_bun: ${{ steps.build-matrix.outputs.run_bun }}
      run_cli: ${{ steps.build-matrix.outputs.run_cli }}
      run_dsh_smoke: ${{ steps.build-matrix.outputs.run_dsh_smoke }}
      run_dsh_daemon_smoke: ${{ steps.build-matrix.outputs.run_dsh_daemon_smoke }}
      run_relay: ${{ steps.build-matrix.outputs.run_relay }}
    steps:
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            root_bun:
              - 'install.sh'
              - 'install.test.ts'
              - 'scripts/materialIconTheme.ts'
              - 'scripts/materialIconTheme.test.ts'
            api_service:
              - 'apps/api-service/**'
            desktop:
              - 'apps/desktop/**'
            desktop_dsh_runtime:
              - 'bun.lock'
              - 'package.json'
              - 'apps/desktop/package.json'
              - 'apps/desktop/scripts/beforePack.mjs'
              - 'apps/desktop/scripts/buildCliBinary.mjs'
              - 'apps/desktop/scripts/buildDshRuntime.mjs'
              - 'apps/desktop/scripts/buildDshRuntimeSmoke.mjs'
              - 'apps/desktop/scripts/dshRuntimeSmoke.mjs'
              - 'apps/desktop/scripts/packageApp.mjs'
              - 'apps/desktop/scripts/taskRunDshDaemonSmoke.mjs'
              - 'apps/desktop/src/main/daemon/**'
            design_tokens:
              - 'packages/design-tokens/**'
            dsh_provider:
              - 'packages/dsh-provider/**'
            dsh_session:
              - 'packages/dsh-session/**'
            pi_memory:
              - 'packages/pi-memory/**'
            pi_task:
              - 'packages/pi-task/**'
            pi_dev_flow:
              - 'packages/pi-dev-flow/**'
            pi_notify:
              - 'packages/pi-notify/**'
            pi_subagents:
              - 'packages/pi-subagents/**'
            pi_workspace:
              - 'packages/pi-workspace/**'
            pi_ask:
              - 'packages/pi-ask/**'
            pi_lsp:
              - 'packages/pi-lsp/**'
            pi_codegraph:
              - 'packages/pi-codegraph/**'
            core:
              - 'packages/core/**'
            cli:
              - 'apps/cli/**'
            relay:
              - 'apps/relay/**'

      - name: Build test matrix
        id: build-matrix
        env:
          ROOT_BUN_CHANGED: ${{ steps.changes.outputs.root_bun }}
          API_SERVICE_CHANGED: ${{ steps.changes.outputs.api_service }}
          DESKTOP_CHANGED: ${{ steps.changes.outputs.desktop }}
          DESKTOP_DSH_RUNTIME_CHANGED: ${{ steps.changes.outputs.desktop_dsh_runtime }}
          DESIGN_TOKENS_CHANGED: ${{ steps.changes.outputs.design_tokens }}
          DSH_PROVIDER_CHANGED: ${{ steps.changes.outputs.dsh_provider }}
          DSH_SESSION_CHANGED: ${{ steps.changes.outputs.dsh_session }}
          PI_MEMORY_CHANGED: ${{ steps.changes.outputs.pi_memory }}
          PI_TASK_CHANGED: ${{ steps.changes.outputs.pi_task }}
          PI_DEV_FLOW_CHANGED: ${{ steps.changes.outputs.pi_dev_flow }}
          PI_NOTIFY_CHANGED: ${{ steps.changes.outputs.pi_notify }}
          PI_SUBAGENTS_CHANGED: ${{ steps.changes.outputs.pi_subagents }}
          PI_WORKSPACE_CHANGED: ${{ steps.changes.outputs.pi_workspace }}
          PI_ASK_CHANGED: ${{ steps.changes.outputs.pi_ask }}
          PI_LSP_CHANGED: ${{ steps.changes.outputs.pi_lsp }}
          PI_CODEGRAPH_CHANGED: ${{ steps.changes.outputs.pi_codegraph }}
          CORE_CHANGED: ${{ steps.changes.outputs.core }}
          CLI_CHANGED: ${{ steps.changes.outputs.cli }}
          RELAY_CHANGED: ${{ steps.changes.outputs.relay }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const has = (name) => process.env[name] === 'true';
          const bunTargets = [];

          const addTarget = (name, workingDirectory, command) => {
            bunTargets.push({
              name,
              working_directory: workingDirectory,
              command,
            });
          };

          if (has('ROOT_BUN_CHANGED')) {
            addTarget('repo-root', '.', 'bunx vitest run install.test.ts scripts/materialIconTheme.test.ts');
          }

          if (has('API_SERVICE_CHANGED')) {
            addTarget('api-service', 'apps/api-service', 'bun run test');
          }

          if (
            has('DESKTOP_CHANGED') ||
            has('CORE_CHANGED') ||
            has('DESIGN_TOKENS_CHANGED') ||
            has('PI_SUBAGENTS_CHANGED') ||
            has('DSH_PROVIDER_CHANGED') ||
            has('DSH_SESSION_CHANGED')
          ) {
            addTarget('desktop', 'apps/desktop', 'bunx vitest run');
          }

          if (has('DESIGN_TOKENS_CHANGED')) {
            addTarget('design-tokens', 'packages/design-tokens', 'bun run test');
          }

          if (has('DSH_PROVIDER_CHANGED')) {
            addTarget('dsh-provider', 'packages/dsh-provider', 'bun run test && bun run typecheck && bun run lint');
          }

          if (has('DSH_SESSION_CHANGED')) {
            addTarget('dsh-session', 'packages/dsh-session', 'bun run test && bun run typecheck && bun run lint');
          }

          if (has('PI_MEMORY_CHANGED')) {
            addTarget('pi-memory', 'packages/pi-memory', 'bun run test');
          }

          if (has('PI_TASK_CHANGED')) {
            addTarget('pi-task', 'packages/pi-task', 'bun run test');
          }

          if (has('PI_DEV_FLOW_CHANGED')) {
            addTarget('pi-dev-flow', 'packages/pi-dev-flow', 'npm pack --dry-run');
          }

          if (has('PI_NOTIFY_CHANGED')) {
            addTarget('pi-notify', 'packages/pi-notify', 'bun run test');
          }

          if (has('PI_SUBAGENTS_CHANGED')) {
            addTarget('pi-subagents', 'packages/pi-subagents', 'bun run test');
          }

          if (has('PI_WORKSPACE_CHANGED')) {
            addTarget('pi-workspace', 'packages/pi-workspace', 'bun run test');
          }

          if (has('PI_ASK_CHANGED')) {
            addTarget('pi-ask', 'packages/pi-ask', 'bun run test');
          }

          if (has('PI_LSP_CHANGED')) {
            addTarget('pi-lsp', 'packages/pi-lsp', 'bun run test');
          }

          if (has('PI_CODEGRAPH_CHANGED')) {
            addTarget('pi-codegraph', 'packages/pi-codegraph', 'bun run test');
          }

          const outputs = [
            `bun_matrix=${JSON.stringify({ include: bunTargets })}`,
            `run_bun=${bunTargets.length > 0}`,
            `run_cli=${has('CLI_CHANGED') || has('DSH_PROVIDER_CHANGED') || has('DSH_SESSION_CHANGED') || has('DESKTOP_DSH_RUNTIME_CHANGED')}`,
            `run_dsh_smoke=${has('DSH_PROVIDER_CHANGED') || has('DSH_SESSION_CHANGED') || has('DESKTOP_DSH_RUNTIME_CHANGED')}`,
            `run_dsh_daemon_smoke=${has('CLI_CHANGED') || has('DSH_PROVIDER_CHANGED') || has('DSH_SESSION_CHANGED') || has('DESKTOP_DSH_RUNTIME_CHANGED')}`,
            `run_relay=${has('RELAY_CHANGED')}`,
          ];

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join('\n')}\n`);
          NODE

  bun-unit-tests:
    name: Bun unit tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_bun == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.bun_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Run ${{ matrix.name }} unit tests
        working-directory: ${{ matrix.working_directory }}
        run: ${{ matrix.command }}

  go-unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_cli == 'true' || needs.detect-changes.outputs.run_relay == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun for CLI DSH runtime tests
        if: ${{ needs.detect-changes.outputs.run_cli == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies for CLI DSH runtime tests
        if: ${{ needs.detect-changes.outputs.run_cli == 'true' }}
        run: bun install --frozen-lockfile --linker hoisted

      - name: Setup Go for CLI tests
        if: ${{ needs.detect-changes.outputs.run_cli == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Run CLI unit tests
        if: ${{ needs.detect-changes.outputs.run_cli == 'true' }}
        working-directory: apps/cli
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=1 go test -race ./internal/agent/dsh ./internal/node/agent ./internal/rpc
          CGO_ENABLED=1 go test -race ./internal/node/workspace -run '^TestCloseLifecycle_DSHOperationBarrierDisposesOnlyClosedWorkspace$'
          CGO_ENABLED=0 go test ./...

      - name: Setup Go for relay tests
        if: ${{ needs.detect-changes.outputs.run_relay == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/relay/go.mod
          cache-dependency-path: apps/relay/go.sum

      - name: Run relay unit tests
        if: ${{ needs.detect-changes.outputs.run_relay == 'true' }}
        working-directory: apps/relay
        run: go test ./...

  dsh-runtime-smoke:
    name: Linux DSH runtime smoke
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_dsh_smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Smoke test DSH runtime
        working-directory: apps/desktop
        run: bun run dsh:smoke:production


  dsh-daemon-smoke:
    name: Linux local daemon DSH desktop-artifact smoke (Electron dev runtime)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_dsh_daemon_smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Smoke test local DSH daemon with desktop artifacts and Electron dev runtime
        working-directory: apps/desktop
        run: bun run dsh:smoke:daemon
